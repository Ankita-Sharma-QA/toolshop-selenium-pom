# Runs the Toolshop application on your own machine (or in CI) using the
# official prebuilt images from https://github.com/testsmith-io/practice-software-testing
#
#   App (UI):  http://localhost:4200
#   API:       http://localhost:8091
#
# Why? The public site is behind a bot-protection check that blocks CI servers.
# Running our own copy makes the pipeline reliable and gives every run fresh test data.

name: toolshop

services:
  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api
    environment:
      - "PHP_OPCACHE_VALIDATE_TIMESTAMPS=1"
      - "DB_PORT=3306"
      - "DB_HOST=mariadb"
      - "host=localhost"
      - "DISABLE_LOGGING=true"
    volumes:
      - laravel-app-code:/var/www
    depends_on:
      - mariadb

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui
    ports:
      - 4200:4200
    command: >
      bash -c "ng serve --host 0.0.0.0 --port 4200"

  web:
    image: nginx:1.27-alpine
    ports:
      - 8091:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - laravel-app-code:/var/www:ro
    depends_on:
      - laravel-api

  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

volumes:
  laravel-app-code:
