# Web server for the Toolshop API (same setup as the official project).
# It passes PHP requests to the laravel-api container.
server {
    listen 80;
    index index.php index.html;
    root /var/www/public;
    server_tokens off;

    # The app's "live activity" widget keeps a connection to /sales-stream open forever.
    # Each open connection blocks one PHP worker, so with several test browsers running
    # in parallel the API runs out of workers and stops answering. The tests don't need
    # this feature, so it is switched off here (204 = "no content").
    location = /sales-stream {
        return 204;
    }

    location / {
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass laravel-api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
