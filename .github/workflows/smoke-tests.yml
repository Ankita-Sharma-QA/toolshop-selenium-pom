# Smoke tests: quick check of the most important flows.
# Runs on every push and pull request to main.
name: Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start the Toolshop app in Docker
        run: bash docker/start-app.sh

      - name: Run smoke suite (Chrome, headless)
        run: |
          set -o pipefail
          mvn -B test -Dsuite=smoke -Dbrowser=chrome -Dheadless=true -DbaseUrl=http://localhost:4200 2>&1 | tee mvn-output.log

      - name: Show test results on the run page
        if: always()
        run: python3 .github/scripts/test_summary.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-report
          path: |
            target/reports/
            target/screenshots/
            target/surefire-reports/
          retention-days: 14
